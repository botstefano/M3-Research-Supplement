name: Validate M-3 research supplement

on:
  push:
    branches:
      - master
      - prepare/zenodo-v1
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dependencies
        run: npm install
      - name: Run M-3 research tests
        run: npm run test:research-v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install statistical-analysis dependencies
        run: python -m pip install -r scripts/requirements-research-analysis.txt
      - name: Compile-check Python scripts
        run: python -m py_compile scripts/analyze_research_v3.py scripts/recalcular_constancia.py
